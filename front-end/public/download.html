<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f0f0f">
    <title>My Downloads</title>
    <link rel="icon" href="img/download.png" type="image-icon">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
        }

        .downloads {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .download-card {
            background: #1c1c1c;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .download-card img {
            width: 100%;
            border-radius: 6px;
        }

        .download-card h4 {
            margin: 8px 0;
            font-size: 14px;
            /* New lines for 2-line ellipsis truncation */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            /* Set a fixed line height so the cards stay the exact same size */
            line-height: 1.4;
            min-height: 2.8em; 
        }

        .download-card a {
            background: #00ff88;
            color: black;
            padding: 6px;
            border-radius: 6px;
            display: block;
            font-weight: bold;
            text-decoration: none;
        }

        .download-card a:hover {
            background: #00cc6f;
        }

        .remove {
            margin-top: 6px;
            color: red;
            cursor: pointer;
            font-size: 13px;
        }

        .remove:hover {
            text-decoration: underline;
        }

        /* ==========================================
   TV INACTIVITY (IDLE) STYLES
========================================== */
        body.tv-idle .tv-focus {
            outline-color: transparent !important;
            box-shadow: none !important;
            transform: scale(1) !important;
            transition: all 0.5s ease !important;
            /* Smooth fade out */
        }
    </style>
</head>

<body>

    <h2 style="padding:15px;">⬇ My Downloads</h2>

    <div class="downloads" id="downloads"></div>

    <script src="download.js"></script>
    <script src="security.js"></script>

</body>

</html>
