<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta name="theme-color" content="#1b3b6f">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="img/cropped_circle_image (8).png" type="image-icon">
</head>

<body>

    <div id="customAlert" class="alert-overlay">
    <div class="alert-box">
        <h3 id="alertTitle">Alert</h3>
        <p id="alertMessage">Message here</p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>


    <div class="login-container">
        <img src="img/user.png" alt="" id="yourImage">
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="file" id="profileImage" accept="image/*"><br><br>
        <button onclick="login()">Login</button>
    </div>

    <script src="index.js"></script>
    <script src="security.js"></script>
</body>

</html>
