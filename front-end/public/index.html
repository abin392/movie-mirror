<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta name="theme-color" content="#1b3b6f">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="img/movie.png" type="image-icon">
</head>

<body>

    <div id="customAlert" class="alert-overlay">
    <div class="alert-box">
        <h3 id="alertTitle">Alert</h3>
        <p id="alertMessage">Message here</p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>


    <div class="login-container">
        <img src="img/user.png" alt="" id="yourImage">
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="file" id="profileImage" accept="image/*"><br><br>
        <button onclick="login()">Login</button>
    </div>

    <script>
        function showAlert(message, title = "Alert") {
        document.getElementById("alertTitle").innerText = title;
        document.getElementById("alertMessage").innerText = message;
        document.getElementById("customAlert").classList.add("show");
    }

    function closeAlert() {
        document.getElementById("customAlert").classList.remove("show");
    }

        // Auto redirect if already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
        window.location.replace("movie.html");
    }

    function login() {
        const username = document.getElementById("username").value.trim();
        const imageInput = document.getElementById("profileImage");

        if (!username || imageInput.files.length === 0) {
            showAlert("Please enter username and select image", "Login Required");
            return;
        }

        const reader = new FileReader();
        reader.onload = function () {
            localStorage.setItem("username", username);
            localStorage.setItem("profileImage", reader.result);
            localStorage.setItem("isLoggedIn", "true");

            // Prevent back button
            window.location.replace("movie.html");
        };

        reader.readAsDataURL(imageInput.files[0]);
    }

    //Live image preview
    const imageInput = document.getElementById("profileImage");
    const previewImage = document.getElementById("yourImage");

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
            previewImage.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
    </script>

</body>

</html>
