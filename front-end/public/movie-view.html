<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie-View</title>
    <link rel="stylesheet" href="movie-view.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">

    <!-- Meta bar color -->
    <meta name="theme-color" content="#2a0e3c">
    <link rel="icon" href="img/cropped_circle_image (8).png" type="image-icon">
</head>

<body>

    <div class="player-container">
        <div class="trailer">
            <h1 style="color: white;">MOVIE TRAILER & EPISODES</h1>
        </div><br>

        <div class="video-box" id="fullscreenContainer">
            <!-- Existing MP4 Player -->
            <video id="movieVideo" onclick="togglePlay()" crossorigin="anonymous">
                <source id="videoSource" src="" type="video/mp4">
            </video>

            <!-- NEW: YouTube Iframe Player (Hidden by default) -->
            <!-- UPDATED: Added pointer-events: none -->
            <iframe id="youtubePlayer"
                style="display: none; width: 100%; height: 100%; aspect-ratio: 16/9; border: none; pointer-events: none;"
                allow="autoplay; fullscreen" allowfullscreen></iframe>

            <!-- Existing Controls -->
            <div class="video-overlay-controls" id="overlayControls">
                <div class="top-controls" id="topControls">
                    <button class="nav-btn" id="fsBackBtn" onclick="toggleCustomFullscreen()" data-tooltip="Exit Fullscreen">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2 id="fsTitle">Loading...</h2>
                </div>
                <div class="main-controls">
                    <button class="nav-btn" onclick="playPrevious()" data-tooltip="Previous"
                        style="position: absolute; left: 50px;">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="nav-btn play-btn" onclick="togglePlay()" data-tooltip="Play/Pause" 
                        style="position: absolute; left: 50%; transform: translateX(-50%);">
                        <i class="fas fa-play" id="playIcon"></i>
                    </button>
                    <button class="nav-btn" onclick="playNext()" data-tooltip="Next"
                        style="position: absolute; right: 50px;">
                        <i class="fas fa-step-forward"></i>
                    </button>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div id="hover-timer" class="hover-timer">0:00</div>

                    <div class="buffer-bar" id="bufferBar"></div>

                    <div class="progress-bar" id="progressBar">
                        <div class="progress-dot" id="progressDot"></div>
                    </div>
                </div>

                <div class="bottom-controls">
                    <div class="timer-display">
                        <span id="currentTime" style="color: white;">0:00</span> <span style="color: white;">/</span>
                        <span id="durationTime" style="color: white;">0:00</span>
                    </div>

                    <div class="volume-container">
                        <i class="fas fa-volume-up" id="volumeIcon" style="color: white;"></i>
                        <input type="range" id="volumeSlider" min="0" max="3" step="0.1" value="1">
                    </div>

                    <button class="fullscreen-btn nav-btn" onclick="toggleCustomFullscreen()"
                        data-tooltip="Full Screen (A)">
                        <i class="fas fa-expand" id="fullScreenIcon"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="movie-details">
            <h1 id="movieTitle">Loading...</h1>
            <p id="movieInfo">
                Hero: Loading... <br>
                Year: Loading... <br>
                Language: Loading... <br>
            </p>
        </div>
    </div>

    <div class="episodes-container">
        <div class="section-title">
            <h2>Episodes</h2>
        </div>
        <div class="episodes-grid" id="episodesGrid" style="margin: 10px;"></div>
    </div>

    <div id="custom-alert" class="alert-hidden">
        <div class="alert-content">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alert-text">This is the last episode.</span>
        </div>
    </div>

</body>
<script src="movie-view.js"></script>
<script src="voice-assistant.js"></script>

</html>
