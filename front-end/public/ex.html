<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex hover video to img</title>
</head>

<body>

    <style>
        .cart {
            position: relative;
            width: 250px;
            height: 350px;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
        }

        /* Media container */
        .media-box {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Image style */
        .media-box img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        /* Video hidden initially */
        .hover-video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* On hover → show video */
        .cart:hover .hover-video {
            opacity: 1;
        }

        .cart:hover .media-box img {
            opacity: 0;
        }

        /* Description overlay */
        .movie-description {
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            width: 100%;
            padding: 15px;
            color: white;
        }
    </style>

    <div class="cart">
        <div class="media-box">
            <img src="img/dude.jpeg" alt="">

            <video class="hover-video" loop playsinline>
                <source src="https://res.cloudinary.com/draqsnyyu/video/upload/v1769606951/Dude_uf8am9.mp4"
                    type="video/mp4">
            </video>
        </div>

        <div class="movie-description">
            <h2>DUDE</h2>
            <h4>
                Hero: <strong>Pratheep</strong><br>
                Year: 2025<br>
                Language: Tamil
            </h4>
            <a href="https://res.cloudinary.com/draqsnyyu/video/upload/v1769606951/Dude_uf8am9.mp4">
                <button><i class="fas far fa-play-circle"></i> Watch Now</button>
            </a>
        </div>
    </div>


</body>

<script>
document.querySelectorAll('.cart').forEach(cart => {
    const video = cart.querySelector('.hover-video');

    cart.addEventListener('mouseenter', () => {
        video.play();
    });

    cart.addEventListener('mouseleave', () => {
        video.pause();
        video.currentTime = 0;
    });
});
</script>


</html>
