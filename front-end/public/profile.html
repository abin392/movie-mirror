<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003d40">
    <title>Your Profile</title>


    <!-- Meta bar color -->
    <meta name="theme-color" content="#003d40">
    <link rel="icon" href="img/user.png" type="image-icon">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/fontawesome.min.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <div class="header">
        <h1>Your Profile</h1>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- Image Preview Popup -->
    <div id="imagePreview" class="image-preview">
        <span class="close">&times;</span>
        <img id="previewImg">
    </div>
    <div class="center-content">
        <div class="user-details">
            <img id="profilePic" src="" alt="Profile Picture" width="150" height="150"><br><br>
            <h3>User Name</h3>
            <div class="un">
                <span id="displayName"></span>
            </div>
            <input type="text" id="usernameInput" placeholder="Enter new username" hidden>

            <br><br>

            <button id="editBtn" onclick="editUsername()">Edit Name</button>
            <button id="saveBtn" onclick="saveUsername()" hidden>Save</button>
            <button id="cancelBtn" onclick="cancelEdit()" hidden>Cancel</button>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <button onclick="changeImage()">Change Image</button>
        </div>
    </div>

    <script src="profile.js"></script>
</body>

</html>
