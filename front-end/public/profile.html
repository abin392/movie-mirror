<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003d40">
    <title>Your Profile</title>


    <!-- Meta bar color -->
    <meta name="theme-color" content="#003d40">
    <link rel="icon" href="img/user.jpg">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/fontawesome.min.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <div class="header">
        <h1>Your Profile</h1>
        <button onclick="logout()">Logout</button>
    </div>
    <div class="user-details">
        <img id="profilePic" src="" alt="Profile Picture" width="150" height="150"><br><br>
        <h3>User Name</h3>
        <span id="displayName"></span><br><br>

        <input type="file" id="imageInput" accept="image/*" hidden>
        <button onclick="changeImage()">Change Image</button>
    </div>

    <!-- Image Preview Popup -->
    <div id="imagePreview" class="image-preview">
        <span class="close">&times;</span>
        <img id="previewImg">
    </div>

    <script>
        // Retrieve and display user data from localStorage
        const username = localStorage.getItem("username");
        const profileImage = localStorage.getItem("profileImage");

        if (username && profileImage) {
            document.getElementById("displayName").innerText = username;
            document.getElementById("profilePic").src = profileImage;
        } else {
            document.getElementById("displayName").innerText = "No user data found.";
        }

        function changeImage() {
            document.getElementById("imageInput").click();
        }

        document.getElementById("imageInput").addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function () {
                localStorage.setItem("profileImage", reader.result);

                // Update image instantly if exists on page
                const img1 = document.getElementById("userImage");
                const img2 = document.getElementById("profilePic");

                if (img1) img1.src = reader.result;
                if (img2) img2.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
        // On page load, set the profile details

        if (username) document.getElementById("displayName").innerText = username;
        if (profileImage) document.getElementById("profilePic").src = profileImage;

        function logout() {
             // 1️⃣ Clear all storage
        localStorage.clear();
        sessionStorage.clear();

        // 2️⃣ Delete ALL cookies for this site
        document.cookie.split(";").forEach(cookie => {
            document.cookie = cookie
                .replace(/^ +/, "")
                .replace(/=.*/, "=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/");
        });

        // 3️⃣ Clear Cache Storage (PWA / Chrome supported)
        if ("caches" in window) {
            caches.keys().then(keys => {
                keys.forEach(key => caches.delete(key));
            });
        }

        // 4️⃣ Disable back navigation
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };

        // 5️⃣ Redirect to login page (hard replace)
        window.location.replace("index.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (!localStorage.getItem("username")) {
            window.location.replace("index.html");
        }
    });


        const profilePic = document.getElementById("profilePic");
        const imagePreview = document.getElementById("imagePreview");
        const previewImg = document.getElementById("previewImg");
        const closeBtn = document.querySelector(".close");

        // Load saved data

        if (username) document.getElementById("displayName").innerText = username;
        if (profileImage) profilePic.src = profileImage;

        // Click image to view
        profilePic.addEventListener("click", () => {
            if (!profilePic.src) return;
            previewImg.src = profilePic.src;
            imagePreview.style.display = "flex";
        });

        // Close popup
        closeBtn.addEventListener("click", () => {
            imagePreview.style.display = "none";
        });

        // Close on background click
        imagePreview.addEventListener("click", (e) => {
            if (e.target === imagePreview) {
                imagePreview.style.display = "none";
            }
        });

    </script>
</body>

</html>
