<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback Form</title>
    <link rel="icon" href="image/user.jpg">
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
</head>

<style>
    /* Specific Styles for Feedback Page */
    .feedback-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(circle at top, #1a0b2e 0%, #000000 100%);
    }

    .feedback-card {
        background: rgba(42, 14, 60, 0.4);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(142, 68, 173, 0.3);
        border-radius: 24px;
        width: 100%;
        max-width: 500px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    h2 {
        color: #8e44ad;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        color: #b3b3b3;
        margin-bottom: 8px;
        font-size: 14px;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(142, 68, 173, 0.5);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: 0.3s;
    }

    input:focus,
    textarea:focus {
        border-color: #8e44ad;
        box-shadow: 0 0 10px rgba(142, 68, 173, 0.3);
    }

    .submit-btn {
        background: linear-gradient(135deg, #8e44ad, #5e2b6d);
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        transition: 0.3s;
        margin-top: 10px;
    }

    .submit-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(142, 68, 173, 0.5);
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #b3b3b3;
        text-decoration: none;
        font-size: 14px;
    }

    .back-link:hover {
        color: #8e44ad;
    }
</style>

<body>

    <div class="feedback-container">
        <div class="feedback-card">
            <h2>Send Feedback</h2>
            <form action="https://formspree.io/f/mzzjadyb" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="feedback">Message</label>
                    <textarea id="feedback" name="feedback" rows="5" placeholder="Tell us what you think..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>
            <a href="movie.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Movies</a>
        </div>
    </div>


    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="security.js"></script>
</body>

</html>
