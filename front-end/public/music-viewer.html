<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2a0e3c">
    <title>Music View</title>
    <link rel="icon" href="img/cropped_circle_image (8).png" type="image-icon">
    <link rel="stylesheet" href="music-viewer.css">
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/js/bootstrap.min.js">
    <link rel="stylesheet" href="assets/js/jquery.min.js">
</head>

<body>

    <div class="viewer-container">
        <div class="now-playing">
            <img id="currentImg" src="" style="width: 200px; border-radius: 20px; box-shadow: 0 0 20px #8e44ad;">
            <h2 id="currentTitle" style="margin-top: 15px;">Select a Song</h2>

            <div class="custom-controls" style="width: 100%; max-width: 400px; margin: 0 auto;">

                <div class="custom-controls" style="width: 100%; max-width: 400px; margin: 0 auto; color: white;">
                    <div class="progress-container"
                        style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <span id="currentTime" style="font-size: 0.8rem; font-weight: bold;">0:00</span>
                        <input type="range" id="progressSlider" value="0" step="0.1" class="custom-slider">
                        <span id="durationTime" style="font-size: 0.8rem; font-weight: bold;">0:00</span>
                    </div>

                    <div class="playback-btns"
                        style="display: flex; gap: 25px; justify-content: center; align-items: center; font-size: 1.5rem; margin-bottom: 15px;">
                        <i class="fas fa-step-backward" id="prevBtn" style="cursor: pointer;"></i>
                        <i class="fas fa-play" id="playPauseBtn" style="cursor: pointer; font-size: 2.2rem;"></i>
                        <i class="fas fa-step-forward" id="nextBtn" style="cursor: pointer;"></i>
                    </div>

                    <div class="volume-container"
                        style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <i class="fas fa-volume-up" id="volumeIcon" style="font-size: 0.9rem;"></i>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1"
                            class="custom-slider" style="width: 100px;">
                    </div>
                </div>
            </div>

            <audio id="mainAudio"></audio>
        </div>

        <div class="music-cart" id="musicList">
        </div>

        <button onclick="window.history.back()"
            style="position: sticky; bottom: 645px; width: 40px; height: 40px; background: black; border: 1px solid white; color: white;  border-radius: 100px; cursor: pointer;"><i class="fas fas fa-arrow-left"></i></button>
    </div>

    <div id="music-alert">
        <i class="fas fa-compact-disc fa-spin alert-icon"></i>
        <span id="alert-text">Playing next song...</span>
    </div>

    <script src="music-viewer.js"></script>
</body>

</html>
